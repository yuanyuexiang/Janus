# ============================================================
# 本地「编译 + 测试」用 compose
#
# 与部署文件（docker-compose.yml）的区别：
#   - 这里有 build:（从源码编镜像）；部署文件只用 image: 引用编好的镜像
#   - 镜像名与部署文件一致（janus-backend / janus-frontend / janus-choice-gateway）
#     所以这里 build 出来的就是部署要用的镜像
#   - 不接 Traefik、不用 external 网络，端口直接开在 127.0.0.1，方便本地访问
#   - 前端用 localhost 连后端（运行时 API_BASE 注入）
#
# 用法：
#   # 1) 本地编译并起核心全栈（postgres + redis + backend + frontend）
#   docker compose -f docker-compose.build.yml up --build
#   # → 浏览器开 http://localhost:3000 ，后端 http://localhost:8000
#   # 数据库迁移在 backend 容器启动时自动执行（entrypoint: alembic upgrade head）
#
#   # 2) 想连带 Choice 行情网关一起起（需 amd64/Rosetta + 已放好 SDK .so）
#   docker compose -f docker-compose.build.yml --profile choice up --build
#
#   # 3) 端口被占？覆盖宿主端口（容器内端口不变，不影响服务互联）
#   POSTGRES_PORT=5544 REDIS_PORT=6390 docker compose -f docker-compose.build.yml up --build
#
#   # 4) 编「生产」镜像（默认就是 amd64，直接推到 Ubuntu 云上用）→ push 到 registry
#   NEXT_PUBLIC_API_BASE=https://janus.matrix-net.tech \
#     docker compose -f docker-compose.build.yml --profile choice build
#   docker compose -f docker-compose.build.yml --profile choice push   # 先 docker login
#
#   # 5)（可选）想要一份镜像在 Mac/Ubuntu 都「原生」跑：用 buildx 编多架构并推 registry
#   docker buildx build --platform linux/amd64,linux/arm64 \
#     -t registry.cn-hangzhou.aliyuncs.com/yuanyuexiang/janus-backend:v6 --push ./backend
#   #（前端同理；choice-gateway 只有 amd64，不做多架构）
#
# 说明：
#   - BUILD_PLATFORM 默认 linux/amd64：一份镜像在云上 Ubuntu 原生跑、在本机 Mac 经
#     Rosetta 也能跑；推到 amd64 服务器不会因架构不符起不来（你云上是 Ubuntu，这是默认安全档）。
#     只想在 Mac 上原生提速（不走 Rosetta）：BUILD_PLATFORM=linux/arm64 docker compose ... up
#   - choice-gateway 必须 amd64（SDK 只有 x86_64 的 .so），所以它单独钉死 amd64，
#     且放在 choice profile 里，默认 up 不启动，避免拖累核心本地测试。
# ============================================================

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: yuanzhuo
      POSTGRES_USER: yuanzhuo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yuanzhuo}
    ports:
      # 宿主端口默认避开常被占用的 5432（容器内仍是 5432，服务间用 postgres:5432 互联）
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yuanzhuo"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      # 宿主端口默认避开常被占用的 6379（容器内仍是 6379）
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  choice-gateway:
    # 放进 choice profile：默认 up 不启动，需要时加 --profile choice
    profiles: ["choice"]
    build:
      context: ./choice-gateway
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    image: ${CHOICE_GATEWAY_IMAGE:-registry.cn-hangzhou.aliyuncs.com/yuanyuexiang/janus-choice-gateway:v2}
    # Choice SDK 只有 x86_64 的 .so，强制 amd64（arm64 Mac 上走 Rosetta）
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "127.0.0.1:9001:9001"
    env_file:
      - ./choice-gateway/.env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9001/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    image: ${BACKEND_IMAGE:-registry.cn-hangzhou.aliyuncs.com/yuanyuexiang/janus-backend:v6}
    # 默认 amd64：云上 Ubuntu 原生跑、本机 Mac 经 Rosetta 也能跑，一份镜像两边通用。
    # 想在 Mac 上原生提速（不走 Rosetta）：BUILD_PLATFORM=linux/arm64 docker compose ... up
    platform: ${BUILD_PLATFORM:-linux/amd64}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      # 不依赖 choice-gateway：它在 choice profile 里、默认不起；
      # backend 连不上行情网关时优雅降级（状态页显示 Choice 待激活），不影响对话/配置
    environment:
      DATABASE_URL: postgresql+asyncpg://yuanzhuo:${POSTGRES_PASSWORD:-yuanzhuo}@postgres:5432/yuanzhuo
      REDIS_URL: redis://redis:6379/0
      CHOICE_GATEWAY_URL: http://choice-gateway:9001
    env_file:
      - ./backend/.env
    volumes:
      - backend_data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # npm 源：默认国内镜像；海外构建可传 NPM_REGISTRY=https://registry.npmjs.org
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    image: ${FRONTEND_IMAGE:-registry.cn-hangzhou.aliyuncs.com/yuanyuexiang/janus-frontend:v6}
    # 默认 amd64（同 backend）：Ubuntu 原生 + Mac Rosetta 通用；Mac 原生提速设 BUILD_PLATFORM=linux/arm64
    platform: ${BUILD_PLATFORM:-linux/amd64}
    restart: unless-stopped
    environment:
      # 本地测试：前端容器 :3000、后端容器 :8000 是不同源 → 浏览器要打绝对地址。
      # API 地址现在是「运行时」注入（不再烤进镜像），改地址不用重新 build。
      API_BASE: ${API_BASE:-http://localhost:8000}
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pg_data:
  redis_data:
  backend_data:
