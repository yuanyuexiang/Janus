services:
  # ---------- 基础设施 ----------
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: yuanzhuo
      POSTGRES_USER: yuanzhuo
      # 生产务必通过环境变量覆盖：POSTGRES_PASSWORD=强密码 docker compose up
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yuanzhuo}
    ports:
      - "5432"
    networks:
      - internal
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yuanzhuo"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379"
    networks:
      - internal
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------- Choice 数据网关 ----------
  # 独立服务，进程级隔离：SDK 崩了不影响 backend
  # 强制 linux/amd64：SDK 只有 x86_64 的 .so（Apple Silicon 上自动 Rosetta 转译）
  # 注意：vendor/EmQuantAPI/libs/ 被 gitignore —— 服务器上 build 前必须先把 SDK
  #       二进制（libEMQuantAPIx64.so 等）拷到该目录，否则容器启动 SDK import 失败。
  choice-gateway:
    # 用预编译镜像（由 docker-compose.build.yml 构建并推送/导入）
    image: ${CHOICE_GATEWAY_IMAGE:-registry.cn-hangzhou.aliyuncs.com/yuanyuexiang/janus-choice-gateway:v2}
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "127.0.0.1:9001:9001"
    networks:
      - internal
    # 账密直登模式：账号开通量化权限后，c.start ForceLogin=1 即可，每次启动重登。
    # 不写 userInfo，因此不需要持久化卷。
    env_file:
      - ./choice-gateway/.env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9001/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------- backend ----------
  backend:
    image: ${BACKEND_IMAGE:-registry.cn-hangzhou.aliyuncs.com/yuanyuexiang/janus-backend:v5}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      choice-gateway:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://yuanzhuo:${POSTGRES_PASSWORD:-yuanzhuo}@postgres:5432/yuanzhuo
      REDIS_URL: redis://redis:6379/0
      # gateway 是 compose 内 DNS 名；backend 通过它走 HTTP
      CHOICE_GATEWAY_URL: http://choice-gateway:9001
      # 其余环境变量（RELAY_*、TUSHARE_TOKEN、ACCESS_PASSWORD 等）从 .env 读
    env_file:
      - ./backend/.env
    volumes:
      # 改密码哈希等运行时数据 —— 必须持久化，否则容器重建密码丢失
      - backend_data:/app/data
    ports:
      - "8000"
    networks:
      # 双网：internal 连 db/redis/gateway（私有，名字不跟共享网撞）；matrix-network 被 Traefik 回源
      - internal
      - matrix-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      # 同域名下 /api/* 路由到后端。显式高优先级，确保比 frontend 的 Host(...) 先匹配。
      # router/service 名加 janus- 前缀，避免与共享 Traefik 网上其他 app 撞名。
      - "traefik.http.routers.janus-backend.rule=Host(`${JANUS_DOMAIN:-janus.matrix-net.tech}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.janus-backend.priority=100"
      - "traefik.http.routers.janus-backend.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.janus-backend.service=janus-backend"
      - "traefik.http.services.janus-backend.loadbalancer.server.port=8000"
      # --- HTTPS（如用 HTTP-only，删掉下面两行，并把 entrypoint 设为 web）---
      - "traefik.http.routers.janus-backend.tls=true"
      - "traefik.http.routers.janus-backend.tls.certresolver=${TRAEFIK_CERTRESOLVER:-aliyunresolver}"

  # ---------- frontend ----------
  # 预编译镜像。API 地址在「运行时」由 API_BASE 注入（见 layout.tsx），
  # 改地址不用重新构建，改这里 + 重启即可。
  frontend:
    image: ${FRONTEND_IMAGE:-registry.cn-hangzhou.aliyuncs.com/yuanyuexiang/janus-frontend:v5}
    restart: unless-stopped
    environment:
      # 浏览器调用的 API 地址。留空 = 相对 /api（同源 Traefik 部署推荐，任何域名都对）。
      # 若前后端不同域，填后端完整地址，如 https://api.example.com
      API_BASE: ${API_BASE:-}
    depends_on:
      - backend
    ports:
      - "3000"
    networks:
      - matrix-network
    labels:
      - "traefik.enable=true"
      # 回源网络由 traefik 全局 --providers.docker.network=matrix-network 决定，无需在此重复
      # 路由规则：按域名（兜底，/api 已被 janus-backend 的高优先级抢先）
      # router/service 名加 janus- 前缀，避免与共享 Traefik 网上其他 app 撞名。
      - "traefik.http.routers.janus-frontend.rule=Host(`${JANUS_DOMAIN:-janus.matrix-net.tech}`)"
      - "traefik.http.routers.janus-frontend.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.janus-frontend.service=janus-frontend"
      # 回源端口
      - "traefik.http.services.janus-frontend.loadbalancer.server.port=3000"
      # --- HTTPS（如用 HTTP-only，删掉下面两行，并把 entrypoint 设为 web）---
      - "traefik.http.routers.janus-frontend.tls=true"
      - "traefik.http.routers.janus-frontend.tls.certresolver=${TRAEFIK_CERTRESOLVER:-aliyunresolver}"


volumes:
  pg_data:
  redis_data:
  backend_data:

networks:
  # Traefik 共享网（已存在）：只有 backend + frontend 接入，供反代回源
  matrix-network:
    external: true
  # 数据层私有网：postgres / redis / choice-gateway / backend 在这里互相通信，
  # 名字（redis/postgres/...）只在本网解析，不跟共享网上其他 app 撞 —— 修 Redis 断开的关键
  internal:
    driver: bridge
